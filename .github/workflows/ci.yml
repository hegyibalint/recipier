name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  SUPABASE_CLI_VERSION: '2.122.0'
  CI: 'true'
  DO_NOT_TRACK: '1'

jobs:
  app:
    name: Application
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: app-${{ github.ref }}
      cancel-in-progress: true
    env:
      SUPABASE_URL: https://ci.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      DEMO_USER_ID: '00000000-0000-4000-8000-000000000001'
      MCP_CLIENT_ID: '00000000-0000-4000-8000-000000000002'
      MCP_RESOURCE_URL: https://ci.example/mcp
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  database:
    name: Database
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: database-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        id: cli
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Select an available Postgres port
        # Stay below the runner's ephemeral port range while Docker pulls the image.
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import errno
          import socket

          for port in range(15432, 15532):
              with socket.socket() as sock:
                  try:
                      sock.bind(("0.0.0.0", port))
                  except OSError as error:
                      if error.errno != errno.EADDRINUSE:
                          raise
                      continue
                  print(f"SUPABASE_DB_PORT={port}")
                  break
          else:
              raise SystemExit("No available Postgres port in 15432–15531")
          PY
      - name: Apply all migrations to a fresh local database
        # Starts only Postgres; no hosted project credentials are present here.
        run: supabase db start
      - name: Test database constraints, ownership, and range queries
        run: supabase test db
      - name: Stop the local database
        if: always() && steps.cli.outcome == 'success'
        run: supabase stop --no-backup
